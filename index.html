<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/config.js" defer></script>

<body>
  <div class="background" aria-hidden="true"></div>
  <div id="sakura" aria-hidden="true"></div>
  <main class="glass-panel">
    <div class="eyebrow"><span></span> A LITTLE CORNER OF THE INTERNET <span></span></div>
    <header class="profile">
      <div class="avatar-wrap"><img id="avatar" src="./assets/images/avatar.png.jpg" alt="Shiming 的头像" width="112" height="112"><span class="avatar-sparkle" aria-hidden="true">✧</span></div>

  <audio id="bgm" loop preload="metadata" playsinline></audio>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 以显示社交链接和复制功能。</p></noscript>
